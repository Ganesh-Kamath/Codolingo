<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="vyn-h-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
  </defs>

  <!-- Clean Transparent/Dark Frame -->
  <rect width="1000" height="240" rx="36" fill="#0A0D14"/>
  <rect width="996" height="236" x="2" y="2" rx="34" fill="none" stroke="#1E2638" stroke-width="2"/>

  <!-- Standalone Symbol (Scalable Vector on Left) -->
  <g transform="translate(60, 28) scale(0.31)">
    <path d="M140 180 L230 180 L300 350 L250 430 Z" fill="#00C9A7" opacity="0.85"/>
    <path d="M250 430 L300 350 L410 140 L470 140 L320 460 L280 460 Z" fill="url(#vyn-h-grad)"/>
    <polygon points="300,240 340,300 300,360 260,300" fill="#7928CA" opacity="0.9"/>
    <polygon points="300,265 325,300 300,335 275,300" fill="#00F5D4"/>
    <circle cx="300" cy="300" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Custom Geometric Wordmark: V Y N T A X -->
  <g fill="#F8FAFC" transform="translate(250, 142)">
    <!-- V -->
    <path d="M0 -62 L18 -62 L42 -4 L66 -62 L84 -62 L49 14 L35 14 Z"/>
    
    <!-- Y with custom angled apex -->
    <path d="M96 -62 L114 -62 L138 -20 L162 -62 L180 -62 L146 -4 L146 14 L128 14 L128 -4 Z"/>
    
    <!-- N with sharp diagonal slice -->
    <path d="M196 -62 L215 -62 L260 -6 L260 -62 L278 -62 L278 14 L259 14 L214 -42 L214 14 L196 14 Z"/>
    
    <!-- T with chamfered crossbar -->
    <path d="M294 -62 L362 -62 L362 -46 L338 -46 L338 14 L318 14 L318 -46 L294 -46 Z"/>
    
    <!-- A with open syntax bridge -->
    <path d="M374 14 L410 -62 L428 -62 L464 14 L444 14 L434 -9 L394 -9 L384 14 Z M400 -24 L428 -24 L414 -52 Z"/>
    
    <!-- X with cyan crossing spark -->
    <path d="M472 -62 L494 -62 L518 -26 L542 -62 L564 -62 L532 -14 L566 14 L544 14 L518 -20 L492 14 L470 14 L504 -14 Z"/>
  </g>

  <!-- Terminal Syntax Dot / Accent Beam -->
  <circle cx="830" cy="140" r="8" fill="#00F5D4"/>
  <rect x="844" y="138" width="28" height="4" rx="2" fill="#7928CA"/>

  <!-- Tagline Sub-lockup -->
  <text x="252" y="185" fill="#8E9CB2" font-family="monospace, -apple-system, BlinkMacSystemFont" font-size="13" font-weight="600" letter-spacing="4.5">LEARN TO CODE. PRACTICE WITH PURPOSE.</text>
</svg>