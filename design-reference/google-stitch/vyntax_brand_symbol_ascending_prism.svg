<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="vyn-grad-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="vyn-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="vyn-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <filter id="vyn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="600" height="600" rx="120" fill="#0A0D14"/>
  <rect width="596" height="596" x="2" y="2" rx="118" fill="none" stroke="#1F293D" stroke-width="2"/>
  <circle cx="300" cy="300" r="220" fill="url(#vyn-grad-accent)" opacity="0.08" filter="blur(40px)"/>

  <!-- VYNTAX Standalone Brand Symbol: The Ascending Syntax Prism (V-Chevron + Upward Terminal Beam) -->
  <g filter="url(#vyn-glow)">
    <!-- Left Wing of V (Solid Precision Pillar) -->
    <path d="M140 180 L230 180 L300 350 L250 430 Z" fill="#00C9A7" opacity="0.85"/>
    
    <!-- Primary Right Wing to Ascending Terminal (Forward Momentum / Exponential Growth) -->
    <path d="M250 430 L300 350 L410 140 L470 140 L320 460 L280 460 Z" fill="url(#vyn-grad-primary)"/>
    
    <!-- Floating Precision Core / Quantum Dot (The 'Syntax Spark' / Level Up Node) -->
    <polygon points="300,240 340,300 300,360 260,300" fill="#7928CA" opacity="0.9"/>
    <polygon points="300,265 325,300 300,335 275,300" fill="#00F5D4"/>
    <circle cx="300" cy="300" r="8" fill="#FFFFFF"/>
    
    <!-- Dynamic Logic Brackets / Architectural Momentum Strokes -->
    <path d="M180 230 L220 310" stroke="#00F5D4" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M430 210 L380 310" stroke="#9D4EDD" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>